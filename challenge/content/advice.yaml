# advice.yaml – Rady pacientovi (AdviceFile, Vertrag v1.9 §10, DR-020). Owner: A1 (T-12).
# Praktische Selbstmanagement-Tipps je Symptom + Verweis bei akuten Beschwerden auf Ambulanz oder 155 (Wortlaut der Klinikvorgabe).
# Regeln für diese Datei (COMMON §2): KEINE Medikamente/Dosierungen, KEINE Diagnose, KEINE Beruhigung, KEINE Reaktionszusage,
# keine Ampel/Stufe/Regel. Die Tipps sind eigene, gekürzte cs/en-Formulierungen nach NCI-Patienteninformationen (cancer.gov,
# US-Regierungswerk; Quelle wird in der UI ausgewiesen) – keine wörtliche Übernahme. Sie ersetzen keine Anweisung des Behandlungsteams.
# cs/en/de: NICHT muttersprachlich geprüft, NICHT klinikfreigegeben (Mentorfrage MQ-T12-01). de (T-27b) sinngleich zu cs/en.
# Tipp-Anzeige: nur für Symptome mit Wert >= min_value (deterministisch, keine KI). Claim-Stufe aller Quellen: B.
version: advice-v1

escalation:
  # v1.10 (A0, A3 T-12 F-01): bei Fieber oder Atemnot steht der Akut-Hinweis immer zuerst.
  always_acute_for: [fever, shortness_of_breath]
  # Wortlaut der Klinikvorgabe (Výzva 3, „Rady pacientovi“): „při akutních obtížích odkaz na ambulanci nebo linku 155“.
  # Als Handlungsanweisung an die Patientin formuliert; keine Aussage über Bewertung, Reaktion oder Dringlichkeitsstufe.
  acute:
    cs: "Při akutních obtížích kontaktujte ambulanci nebo volejte 155."
    en: "In case of acute problems, contact the outpatient clinic or call 155."
    de: "Bei akuten Beschwerden wenden Sie sich an die Ambulanz oder rufen Sie 155 an."
  general:
    cs: "Tyto rady jsou obecné a nenahrazují pokyny vašeho ošetřujícího týmu. Při akutních obtížích kontaktujte ambulanci nebo volejte 155."
    en: "These tips are general and do not replace the instructions of your care team. In case of acute problems, contact the outpatient clinic or call 155."
    de: "Diese Hinweise sind allgemein und ersetzen nicht die Anweisungen Ihres Behandlungsteams. Bei akuten Beschwerden wenden Sie sich an die Ambulanz oder rufen Sie 155 an."
  ambulance_phone: "[telefon ambulance]"
  source_id: SRC-FNM-VYZVA3

advice:
  # ---- Kern -----------------------------------------------------------------------------------------------------------
  - id: ADV-FATIGUE-01
    symptom_key: fatigue
    status: draft
    min_value: 2
    max_value: 4
    tips:
      - cs: "Během dne si naplánujte krátké odpočinky. Případné zdřímnutí by mělo trvat méně než hodinu, aby neovlivnilo spánek v noci."
        en: "Plan short rests during the day. If you nap, keep it under an hour so it does not disturb your sleep at night."
        de: "Planen Sie über den Tag verteilt kurze Ruhepausen ein. Ein Nickerchen sollte weniger als eine Stunde dauern, damit es den Nachtschlaf nicht stört."
      - cs: "Důležité činnosti dělejte v době, kdy máte nejvíc sil, a činnosti, které únavu zhoršují, omezte."
        en: "Do the activities that matter most to you when you have the most energy, and limit those that make you more tired."
        de: "Erledigen Sie die für Sie wichtigsten Dinge, wenn Sie am meisten Kraft haben, und schränken Sie Tätigkeiten ein, die Sie zusätzlich ermüden."
      - cs: "Lehký pohyb, například procházka, může pomoci k větší energii. Vhodný rozsah si probere s ošetřujícím týmem."
        en: "Gentle movement such as a walk may help you feel more energetic. Talk with your care team about how much is right for you."
        de: "Leichte Bewegung wie ein Spaziergang kann helfen, sich energiegeladener zu fühlen. Besprechen Sie mit Ihrem Behandlungsteam, wie viel für Sie passend ist."
      - cs: "Pijte dostatek vody a jezte raději víckrát denně menší porce."
        en: "Drink plenty of water and eat several small meals through the day rather than a few big ones."
        de: "Trinken Sie ausreichend Wasser und essen Sie über den Tag verteilt mehrere kleine Mahlzeiten statt weniger großer."
    source_ids: [SRC-NCI-FATIGUE]

  - id: ADV-NAUSEA-01

    symptom_key: nausea

    status: draft
    min_value: 2
    max_value: 4
    tips:
      - cs: "Popíjejte tekutiny po malých doušcích během celého dne, například vodu, čaj nebo vývar."
        en: "Sip fluids in small amounts throughout the day, for example water, tea or broth."
        de: "Trinken Sie über den Tag verteilt in kleinen Schlucken, zum Beispiel Wasser, Tee oder Brühe."
      - cs: "Jezte pětkrát až šestkrát denně malé porce místo tří velkých jídel."
        en: "Eat five to six small meals a day instead of three large ones."
        de: "Essen Sie fünf- bis sechsmal täglich kleine Mahlzeiten statt drei großer."
      - cs: "Zkuste lehká jídla, která žaludek nezatěžují, například toast, rýži, těstoviny nebo krekry. Mastným, smaženým, sladkým a kořeněným jídlům se vyhněte, pokud vám po nich bývá nevolno."
        en: "Try foods that are gentle on the stomach, such as toast, rice, plain pasta or crackers. Avoid greasy, fried, sweet or spicy foods if they make you feel sick."
        de: "Probieren Sie leichte Speisen, die den Magen schonen, etwa Toast, Reis, Nudeln ohne Soße oder Cracker. Meiden Sie fettige, frittierte, süße oder scharfe Speisen, wenn Ihnen davon übel wird."
      - cs: "Silné pachy mohou nevolnost zhoršit. Jezte v dobře větrané místnosti a případně požádejte někoho, aby jídlo připravil místo vás."
        en: "Strong smells can make nausea worse. Eat in a well-ventilated room and, if you can, ask someone else to prepare your food."
        de: "Starke Gerüche können die Übelkeit verschlimmern. Essen Sie in einem gut gelüfteten Raum und lassen Sie Ihr Essen, wenn möglich, von jemand anderem zubereiten."
    source_ids: [SRC-NCI-NAUSEA-VOMITING]

  - id: ADV-DIARRHEA-01

    symptom_key: diarrhea

    status: draft
    min_value: 2
    max_value: 4
    tips:
      - cs: "Pijte dostatek vody nebo vývaru, nejlépe o pokojové teplotě. Při průjmu tělo ztrácí tekutiny."
        en: "Drink plenty of water or broth, ideally at room temperature. Diarrhea makes your body lose fluids."
        de: "Trinken Sie reichlich Wasser oder Brühe, am besten in Zimmertemperatur. Durchfall lässt Ihren Körper Flüssigkeit verlieren."
      - cs: "Jezte častěji menší porce jídel s nízkým obsahem vlákniny, například bílé pečivo nebo těstoviny. Vyhněte se alkoholu, mléčným výrobkům, kořeněným a mastným jídlům a kávě."
        en: "Eat small, frequent meals that are low in fiber, such as white bread or pasta. Avoid alcohol, milk products, spicy and fatty foods, and caffeinated drinks."
        de: "Essen Sie kleine, häufige Mahlzeiten mit wenig Ballaststoffen, etwa Weißbrot oder Nudeln. Meiden Sie Alkohol, Milchprodukte, scharfe und fettige Speisen sowie koffeinhaltige Getränke."
      - cs: "Okolí konečníku udržujte čisté a suché, například teplou vodou a vlhčenými ubrousky."
        en: "Keep the anal area clean and dry, for example with warm water and baby wipes."
        de: "Halten Sie den Analbereich sauber und trocken, zum Beispiel mit warmem Wasser und feuchten Tüchern."
      - cs: "Zapisujte si, kolikrát denně máte stolici, a záznam ukažte svému týmu."
        en: "Keep a record of your bowel movements and show it to your care team."
        de: "Führen Sie Buch über Ihren Stuhlgang und zeigen Sie die Aufzeichnung Ihrem Behandlungsteam."
    source_ids: [SRC-NCI-DIARRHEA]

  - id: ADV-FEVER-01

    symptom_key: fever

    status: draft
    min_value: 1
    max_value: 4
    tips:
      - cs: "Často si myjte ruce mýdlem a teplou vodou, zejména před jídlem."
        en: "Wash your hands often with soap and warm water, especially before eating."
        de: "Waschen Sie sich oft die Hände mit Seife und warmem Wasser, besonders vor dem Essen."
      - cs: "Vyhýbejte se nemocným lidem a velkým davům."
        en: "Stay away from people who are sick and from crowds."
        de: "Halten Sie Abstand zu kranken Menschen und zu Menschenmengen."
      - cs: "Každý den si pečlivě čistěte zuby a zkontrolujte, zda v ústech nemáte vředy nebo jiné změny."
        en: "Clean your teeth well each day and check your mouth for sores or other changes."
        de: "Putzen Sie täglich gründlich die Zähne und prüfen Sie Ihren Mund auf Wunden oder andere Veränderungen."
    source_ids: [SRC-NCI-INFECTION]

  - id: ADV-PAIN-01

    symptom_key: pain

    status: draft
    min_value: 2
    max_value: 4
    tips:
      - cs: "Všímejte si, kde a kdy bolest cítíte, jaká je (pálivá, ostrá, tepavá), co ji zhoršuje a co ji zmírňuje. Řekněte to svému týmu."
        en: "Notice where and when you feel pain, what it feels like (burning, sharp, throbbing), and what makes it worse or better. Tell your care team."
        de: "Achten Sie darauf, wo und wann Sie Schmerzen spüren, wie sie sich anfühlen (brennend, stechend, pochend) und was sie verschlimmert oder lindert. Sagen Sie es Ihrem Behandlungsteam."
      - cs: "Odvést pozornost od bolesti může pomoci poslech hudby, procházka venku nebo film."
        en: "Taking your mind off the pain can help, for example by listening to music, walking outside or watching a film."
        de: "Ablenkung kann helfen, zum Beispiel Musik hören, draußen spazieren gehen oder einen Film ansehen."
      - cs: "Zkuste relaxační techniky, například meditaci nebo vedené představy."
        en: "Try relaxation techniques such as meditation or guided imagery."
        de: "Probieren Sie Entspannungstechniken wie Meditation oder geführte Vorstellungsbilder."
    source_ids: [SRC-NCI-PAIN]

  # ---- Profil -----------------------------------------------------------------------------------------------------------
  - id: ADV-PERIPHERAL_NEUROPATHY-01
    symptom_key: peripheral_neuropathy
    status: draft
    min_value: 2
    max_value: 4
    tips:
      - cs: "Předcházejte pádům: odstraňte z cesty koberečky, noste pevnou obuv s měkkou podrážkou a po sedu nebo lehu vstávejte pomalu."
        en: "Prevent falls: move rugs out of your way, wear sturdy shoes with soft soles, and get up slowly after sitting or lying down."
        de: "Beugen Sie Stürzen vor: Räumen Sie Teppiche aus dem Weg, tragen Sie feste Schuhe mit weicher Sohle und stehen Sie nach dem Sitzen oder Liegen langsam auf."
      - cs: "V kuchyni a při sprchování buďte opatrní. Používejte chňapky a nechte si zkontrolovat, zda voda není příliš horká."
        en: "Take extra care in the kitchen and shower. Use potholders and ask someone to check that the water is not too hot."
        de: "Seien Sie in Küche und Dusche besonders vorsichtig. Benutzen Sie Topflappen und lassen Sie jemanden prüfen, ob das Wasser nicht zu heiß ist."
      - cs: "Chraňte ruce a nohy. Noste obuv uvnitř i venku, každý den si zkontrolujte, zda nemáte říznutí nebo škrábance, a v chladu se teple oblékejte."
        en: "Protect your hands and feet. Wear shoes indoors and outdoors, check every day for cuts or scratches, and dress warmly in the cold."
        de: "Schützen Sie Hände und Füße. Tragen Sie drinnen und draußen Schuhe, prüfen Sie täglich auf Schnitte oder Kratzer und kleiden Sie sich bei Kälte warm."
      - cs: "Požádejte o pomoc s náročnějšími úkony a dopřejte si na všechno víc času."
        en: "Ask for help with difficult tasks and give yourself more time for everything."
        de: "Bitten Sie bei schwierigen Aufgaben um Hilfe und nehmen Sie sich für alles mehr Zeit."
    source_ids: [SRC-NCI-NERVE]

  - id: ADV-HAND_FOOT-01

    symptom_key: hand_foot

    status: draft
    min_value: 2
    max_value: 4
    tips:
      - cs: "Po sprše nebo koupeli, dokud je pokožka ještě lehce vlhká, použijte krém nebo mast, který vám navrhl váš tým."
        en: "After a shower or bath, while your skin is still slightly damp, apply a cream or ointment that your care team has suggested."
        de: "Tragen Sie nach dem Duschen oder Baden, solange die Haut noch leicht feucht ist, eine Creme oder Salbe auf, die Ihr Behandlungsteam vorgeschlagen hat."
      - cs: "Sprchujte se a koupejte krátce ve vlažné, ne horké vodě."
        en: "Take short showers or baths in lukewarm, not hot, water."
        de: "Duschen oder baden Sie kurz in lauwarmem, nicht heißem Wasser."
      - cs: "Nenoste těsnou obuv. Při mytí nádobí nebo úklidu chraňte ruce rukavicemi."
        en: "Do not wear tight-fitting shoes. Wear gloves to protect your hands when washing dishes or cleaning."
        de: "Tragen Sie keine eng sitzenden Schuhe. Schützen Sie Ihre Hände beim Geschirrspülen oder Putzen mit Handschuhen."
    source_ids: [SRC-NCI-SKIN-NAIL]

  - id: ADV-MOUTH_SORES-01

    symptom_key: mouth_sores

    status: draft
    min_value: 2
    max_value: 4
    tips:
      - cs: "Každý den zkontrolujte ústa, zda v nich nejsou vředy nebo bílé skvrny. Po jídle a před spaním jemně čistěte zuby, dásně i jazyk velmi měkkým kartáčkem."
        en: "Check your mouth every day for sores or white spots. After meals and before bed, gently brush your teeth, gums and tongue with a very soft toothbrush."
        de: "Prüfen Sie täglich Ihren Mund auf Wunden oder weiße Stellen. Putzen Sie nach den Mahlzeiten und vor dem Schlafengehen sanft Zähne, Zahnfleisch und Zunge mit einer sehr weichen Zahnbürste."
      - cs: "Během dne vyplachujte ústa roztokem teplé vody, jedlé sody a soli. Poměr si nechte zapsat od zdravotní sestry."
        en: "Rinse your mouth through the day with a solution of warm water, baking soda and salt. Ask your nurse to write down the right mixture for you."
        de: "Spülen Sie den Mund über den Tag verteilt mit einer Lösung aus warmem Wasser, Natron und Salz. Lassen Sie sich das richtige Mischungsverhältnis von Ihrer Pflegekraft aufschreiben."
      - cs: "Při bolestivých ústech volte měkká a vlhká jídla, která se snadno polykají. Vyhněte se dráždivým jídlům a nápojům, tedy křupavým, slaným, kořeněným, sladkým a alkoholu."
        en: "With a sore mouth, choose soft, moist foods that are easy to swallow. Avoid foods and drinks that irritate, such as crunchy, salty, spicy or sugary foods and alcohol."
        de: "Wählen Sie bei wundem Mund weiche, feuchte Speisen, die sich leicht schlucken lassen. Meiden Sie reizende Speisen und Getränke wie knusprige, salzige, scharfe oder zuckerhaltige Speisen und Alkohol."
    source_ids: [SRC-NCI-MOUTH-THROAT]

  - id: ADV-VOMITING-01

    symptom_key: vomiting

    status: draft
    min_value: 2
    max_value: 4
    tips:
      - cs: "Popíjejte tekutiny po malých doušcích, aby tělo neztratilo příliš mnoho vody."
        en: "Sip fluids in small amounts so that your body does not lose too much water."
        de: "Trinken Sie in kleinen Schlucken, damit Ihr Körper nicht zu viel Wasser verliert."
      - cs: "Po jídle asi 30 minut odpočívejte vsedě nebo v lehu s podloženou hlavou."
        en: "After eating, rest for about 30 minutes sitting upright or lying with your head raised."
        de: "Ruhen Sie nach dem Essen etwa 30 Minuten aufrecht sitzend oder mit erhöhtem Kopf liegend."
      - cs: "Zapisujte si, kdy vám bylo nevolno nebo kdy jste zvracel(a) a co jste předtím jedl(a). Tým může záznam využít."
        en: "Write down when you felt sick or vomited and what you had eaten beforehand. Your care team can use this record."
        de: "Notieren Sie, wann Ihnen übel war oder Sie erbrochen haben und was Sie zuvor gegessen hatten. Ihr Behandlungsteam kann diese Aufzeichnung nutzen."
    source_ids: [SRC-NCI-NAUSEA-VOMITING]

  - id: ADV-RASH-01

    symptom_key: rash

    status: draft
    min_value: 2
    max_value: 4
    tips:
      - cs: "Používejte jemné mýdlo a sprchujte se krátce ve vlažné vodě."
        en: "Use a mild soap and take short showers in lukewarm water."
        de: "Verwenden Sie eine milde Seife und duschen Sie kurz in lauwarmem Wasser."
      - cs: "Po sprše, dokud je pokožka ještě lehce vlhká, použijte krém nebo mast, který vám navrhl váš tým. Vyhněte se přípravkům s alkoholem nebo parfemací."
        en: "After showering, while your skin is still slightly damp, apply a cream or ointment that your care team has suggested. Avoid products that contain alcohol or fragrance."
        de: "Tragen Sie nach dem Duschen, solange die Haut noch leicht feucht ist, eine Creme oder Salbe auf, die Ihr Behandlungsteam vorgeschlagen hat. Meiden Sie Produkte mit Alkohol oder Duftstoffen."
      - cs: "Chraňte pokožku před sluncem opalovacím krémem, volným oblečením s dlouhými rukávy a kloboukem se širokou krempou."
        en: "Protect your skin from the sun with sunscreen, loose clothing with long sleeves and a wide-brimmed hat."
        de: "Schützen Sie Ihre Haut vor der Sonne mit Sonnencreme, lockerer langärmeliger Kleidung und einem breitkrempigen Hut."
    source_ids: [SRC-NCI-SKIN-NAIL]

  - id: ADV-SHORTNESS_OF_BREATH-01

    symptom_key: shortness_of_breath

    status: draft
    min_value: 2
    max_value: 4
    tips:
      - cs: "Zkuste dýchání s našpulenými (téměř zavřenými) rty."
        en: "Try breathing with your lips pursed (almost closed)."
        de: "Versuchen Sie, mit gespitzten (fast geschlossenen) Lippen zu atmen."
      - cs: "Pomoci může proud chladného vzduchu z ventilátoru nasměrovaný na tvář."
        en: "A fan blowing cool air across your cheek may help."
        de: "Ein Ventilator, der kühle Luft über die Wange bläst, kann helfen."
      - cs: "Zkuste relaxační techniky, například meditaci."
        en: "Try relaxation techniques such as meditation."
        de: "Probieren Sie Entspannungstechniken wie Meditation."
    source_ids: [SRC-NCI-PDQ-CARDIOPULM]

  - id: ADV-DECREASED_APPETITE-01

    symptom_key: decreased_appetite

    status: draft
    min_value: 2
    max_value: 4
    tips:
      - cs: "Jezte pětkrát až šestkrát denně malé porce, zhruba každé dvě až tři hodiny, i když nemáte hlad. Pomoci může nastavená připomínka."
        en: "Eat five to six small meals a day, about every two to three hours, even if you are not hungry. A reminder you set for yourself can help."
        de: "Essen Sie fünf- bis sechsmal täglich kleine Mahlzeiten, etwa alle zwei bis drei Stunden, auch wenn Sie keinen Hunger haben. Eine selbst gestellte Erinnerung kann helfen."
      - cs: "Nejdřív jezte bílkovinná a výživná jídla, dokud je chuť k jídlu nejlepší. Když se vám nechce jíst pevnou stravu, zkuste mléčné koktejly, smoothie nebo polévky."
        en: "Eat high-protein, energy-rich foods first, while your appetite is strongest. If you do not feel like solid food, try milkshakes, smoothies or soups."
        de: "Essen Sie zuerst eiweißreiche, energiereiche Speisen, solange der Appetit am größten ist. Wenn Ihnen nicht nach fester Nahrung ist, probieren Sie Milchshakes, Smoothies oder Suppen."
      - cs: "Tekutiny pijte hlavně mezi jídly, během jídla jen po malých doušcích, ať se víc najíte."
        en: "Drink fluids mainly between meals and only small sips during meals, so you can eat more."
        de: "Trinken Sie hauptsächlich zwischen den Mahlzeiten und während des Essens nur kleine Schlucke, damit Sie mehr essen können."
      - cs: "Zkuste jíst v příjemném prostředí, třeba s blízkými a při hudbě."
        en: "Try eating in a pleasant setting, for example with loved ones and some music."
        de: "Versuchen Sie, in angenehmer Umgebung zu essen, zum Beispiel mit Ihren Liebsten und etwas Musik."
    source_ids: [SRC-NCI-APPETITE]

sources:
  - id: SRC-FNM-VYZVA3
    title: "Rakathon výzvy – onkologie FNM, Výzva 3 „Digitální hlídač nežádoucích účinků“, Fakultní nemocnice Motol a Homolka (Challenge-Unterlage, Datei vom Menschen, nicht im Repo)"
    locator: "Folie „Rozsah první verze“ (PDF-Seite 9), Spalte „Rady pacientovi“: „Praktické rady ke zvládání symptomů; při akutních obtížích odkaz na ambulanci nebo linku 155.“"
    claim_level: B
  - id: SRC-NCI-FATIGUE
    title: "Fatigue and Cancer – Side Effects, NCI (cancer.gov), Patient information, geöffnet 2026-10-16"
    url: https://www.cancer.gov/about-cancer/treatment/side-effects/fatigue
    locator: "Abschnitt „Self-care/Managing fatigue“: Rest and sleep (Naps < 1 h), „Start with what's most important“, Exercise (Gehen), Food and drink"
    claim_level: B
  - id: SRC-NCI-NAUSEA-VOMITING
    title: "Nausea and Vomiting and Cancer – Side Effects, NCI (cancer.gov), Patient information, geöffnet 2026-10-16"
    url: https://www.cancer.gov/about-cancer/treatment/side-effects/nausea-vomiting
    locator: "Abschnitt „Tips for managing nausea and vomiting“ (Fluids, easy foods, avoid foods/odors, small meals, rest upright 30 min, Record)"
    claim_level: B
  - id: SRC-NCI-DIARRHEA
    title: "Diarrhea and Cancer – Side Effects, NCI (cancer.gov), Patient information, geöffnet 2026-10-16"
    url: https://www.cancer.gov/about-cancer/treatment/side-effects/diarrhea
    locator: "Abschnitt „Tips for managing diarrhea“ (Fluids room temperature, small low-fiber meals, foods to avoid, keep anal area clean and dry, record of bowel movements)"
    claim_level: B
  - id: SRC-NCI-INFECTION
    title: "Infection and Neutropenia and Cancer Treatment – Side Effects, NCI (cancer.gov), Patient information, geöffnet 2026-10-16"
    url: https://www.cancer.gov/about-cancer/treatment/side-effects/infection
    locator: "Abschnitt „Ways to prevent infection“ (Wash hands often, stay extra clean/check mouth daily, avoid germs/people who are sick/crowds)"
    claim_level: B
  - id: SRC-NCI-PAIN
    title: "Pain and Cancer Treatment – Side Effects, NCI (cancer.gov), Patient information, geöffnet 2026-10-16"
    url: https://www.cancer.gov/about-cancer/treatment/side-effects/pain
    locator: "Abschnitte „Describing your pain“ und „Complementary and integrative medicine practices to manage pain“ (Distraction, Guided imagery, Meditation)"
    claim_level: B
  - id: SRC-NCI-NERVE
    title: "Nerve Problems (Peripheral Neuropathy) and Cancer Treatment – Side Effects, NCI (cancer.gov), Patient information, geöffnet 2026-10-16"
    url: https://www.cancer.gov/about-cancer/treatment/side-effects/nerve-problems
    locator: "Abschnitt „Ways to prevent or manage problems related to nerve changes“ (Prevent falls, kitchen/shower, protect hands and feet, ask for help and slow down)"
    claim_level: B
