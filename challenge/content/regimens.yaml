  - id: PAZOPANIB
    label: { cs: Pazopanib, en: Pazopanib, de: Pazopanib }
    cycle_length_days: 28
    drugs:
      - { name: pazopanib, atc: L01EX03 }
    symptom_keys: [decreased_appetite, diarrhea, fatigue, hand_foot, nausea, pain, rash, vomiting, mouth_sores, peripheral_neuropathy, shortness_of_breath, fever]
    watch_notes:
      - symptom_key: hand_foot
        text:
          cs: "Pazopanib: syndrom palmoplantární erytrodysestezie je v tabulce nežádoucích účinků (RCC) uveden jako velmi častý."
          en: "Pazopanib: palmar-plantar erythrodysaesthesia syndrome is listed as very common in the table of adverse reactions (RCC)."
          de: "Pazopanib: Das palmar-plantare Erythrodysästhesie-Syndrom wird in der Tabelle der Nebenwirkungen als sehr häufig geführt (RCC)."
        source_id: SRC-SUKL-VOTRIENT
      - symptom_key: diarrhea
        text:
          cs: "Pazopanib: průjem, nauzea a zvracení jsou v tabulce nežádoucích účinků (RCC) uvedeny jako velmi časté."
          en: "Pazopanib: diarrhoea, nausea and vomiting are listed as very common in the table of adverse reactions (RCC)."
          de: "Pazopanib: Durchfall, Übelkeit und Erbrechen werden in der Tabelle der Nebenwirkungen als sehr häufig geführt (RCC)."
        source_id: SRC-SUKL-VOTRIENT
      - symptom_key: decreased_appetite
        text:
          cs: "Pazopanib: snížení chuti k jídlu je v tabulce nežádoucích účinků (RCC) uvedeno jako velmi časté."
          en: "Pazopanib: decreased appetite is listed as very common in the table of adverse reactions (RCC)."
          de: "Pazopanib: Verminderter Appetit wird in der Tabelle der Nebenwirkungen als sehr häufig geführt (RCC)."
        source_id: SRC-SUKL-VOTRIENT
