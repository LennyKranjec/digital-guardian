          en: "Nivolumab monotherapy: diarrhoea, vomiting and nausea are listed as very common in the table; colitis as common."
          de: "Nivolumab-Monotherapie: Durchfall, Erbrechen und Übelkeit werden in der Tabelle als sehr häufig geführt, Kolitis als häufig."
