# ctcae.yaml – CTCAE-v6.0-Subset der getrackten Symptome (CtcaeFile, Vertrag v1). Owner: A1 (T-01).
# Gradtexte, Definitionen und Begriffe wörtlich aus CTCAE v6.0 (NCI/NIH/DHHS). Urheberrechtsstatus: Annahme ANN-06 (US-Regierungswerk) ist im PDF
# nicht belegt; NCI verlangt Quellenangabe + Link bei Wiedergabe – siehe SOURCES.md §2. Quelle in jeder Anzeige/jedem Export nennen.
# Abgleich: Text jedes Grades und jeder Definition ist gegen die angegebene PDF-Seite geprüft (Leerraum/Bindestrich-normalisiert).
# Fehlender Grad = in CTCAE '-' (nicht definiert). MedDRA-LLT-Code (MedDRA 28.0) und SOC aus der NCI-Excel-Fassung (das PDF enthält keine Codes);
# MedDRA ist Eigentum der MSSO/ICH-Lizenzgeber – hier nur als Bezeichner der NCI-Veröffentlichung geführt.
# label.cs = eigene Übersetzung (nicht muttersprachlich geprüft, nicht MedDRA-Czech); label.en = CTCAE-Begriff.
version: ctcae-subset-v1
source:
  id: SRC-CTCAE-V6
  title: Common Terminology Criteria for Adverse Events (CTCAE) v6.0 (MedDRA 28.0), NCI/NIH/DHHS, published July 22, 2025 (PDF Jan 2026); MedDRA-LLT-Code und SOC aus der NCI-Excel-Fassung (SRC-CTCAE-V6-XLSX)
  url: https://dctd.cancer.gov/research/ctep-trials/for-sites/adverse-events/ctcae-v6.pdf
  locator: Seite je Begriff im Feld locator der Begriffe
  claim_level: B
terms:
- id: CTCAE-FATIGUE
  term_en: Fatigue
  label:
    cs: Únava
    en: Fatigue
    de: "Fatigue"
  meddra_code: '10016256'
  soc: General disorders and administration site conditions
  definition_en: A disorder characterized by a state of generalized weakness with a pronounced inability to summon sufficient energy to accomplish daily activities.
  grades:
    '1': Fatigue relieved by rest
    '2': Fatigue not relieved by rest; limiting instrumental ADL or mild/moderate impact on age-appropriate normal daily activity (pediatric)
    '3': Fatigue not relieved by rest, limiting self-care ADL or severe impact on age-appropriate normal daily activity (pediatric)
  locator: PDF S. 84 (Fatigue)
- id: CTCAE-NAUSEA
  term_en: Nausea
  label:
    cs: Nevolnost
    en: Nausea
    de: "Übelkeit"
  meddra_code: '10028813'
  soc: Gastrointestinal disorders
  definition_en: A disorder characterized by a queasy sensation and/or the urge to vomit.
  grades:
    '1': Loss of appetite without alteration in eating habits
    '2': Oral intake decreased without significant weight loss, dehydration or malnutrition; IV intervention indicated
    '3': Inadequate oral caloric or fluid intake; tube feeding, TPN, or hospitalization indicated
  locator: PDF S. 69 (Nausea)
- id: CTCAE-VOMITING
  term_en: Vomiting
  label:
    cs: Zvracení
    en: Vomiting
    de: "Erbrechen"
  meddra_code: '10047700'
  soc: Gastrointestinal disorders
  definition_en: A disorder characterized by the reflexive act of ejecting the contents of the stomach through the mouth.
  grades:
    '1': Intervention not indicated
    '2': Initiation of outpatient IV hydration; medical intervention indicated
    '3': Initiation of tube feeding, or TPN; hospitalization indicated
    '4': Life-threatening consequences
    '5': Death
  locator: PDF S. 82 (Vomiting)
- id: CTCAE-DIARRHEA
  term_en: Diarrhea
  label:
    cs: Průjem
    en: Diarrhea
    de: "Durchfall"
  meddra_code: '10012727'
  soc: Gastrointestinal disorders
  definition_en: A disorder characterized by an increase in frequency and/or loose or watery bowel movements.
  grades:
    '1': Change in consistency or frequency
    '2': Increase of 4 - 6 stools per day over baseline; moderate increase in ostomy output compared to baseline; limiting instrumental ADL or mild/moderate impact on age-appropriate normal daily activity (pediatric); change in consistency or frequency AND limiting instrumental ADL or mild/moderate impact on age-appropriate normal daily activity (pediatric)
    '3': Increase of >=7 stools per day over baseline; hospitalization indicated; severe increase in ostomy output compared to baseline; requires IV intervention; limiting self-care ADL or severe impact on age-appropriate normal daily activity (pediatric)
    '4': Life-threatening consequences; urgent intervention indicated
    '5': Death
  locator: PDF S. 51 (Diarrhea)
- id: CTCAE-FEVER
  term_en: Fever
  label:
    cs: Horečka
    en: Fever
    de: "Fieber"
  meddra_code: '10016558'
  soc: General disorders and administration site conditions
  definition_en: A disorder characterized by elevation of the body's temperature above the upper limit of normal.
  grades:
    '1': 38.0 - 39.0 degrees C (100.4 - 102.2 degrees F)
    '2': '>39.0 - 40.0 degrees C (102.3 - 104.0 degrees F)'
    '3': '>40.0 degrees C (>104.0 degrees F) for <=24 hrs'
    '4': '>40.0 degrees C (>104.0 degrees F) for >24 hrs'
    '5': Death
  locator: PDF S. 85 (Fever)
- id: CTCAE-FEBRILE_NEUTROPENIA
  term_en: Febrile neutropenia
  label:
    cs: Febrilní neutropenie
    en: Febrile neutropenia
    de: "Febrile Neutropenie"
  meddra_code: '10016288'
  soc: Blood and lymphatic system disorders
  definition_en: A disorder characterized by an ANC <1000/mm3 and a single temperature of >38.3 degrees C (101 degrees F) or a sustained temperature of >=38 degrees C (100.4 degrees F) for more than one hour.
  grades:
    '3': ANC <1000/mm3 with a single temperature of >38.3 degrees C (101 degrees F) or a sustained temperature of >=38 degrees C (100.4 degrees F) for more than one hour
    '4': Life-threatening consequences; urgent intervention indicated
    '5': Death
  locator: PDF S. 6 (Febrile neutropenia)
- id: CTCAE-PAIN
  term_en: Pain
  label:
    cs: Bolest
    en: Pain
    de: "Schmerzen"
  meddra_code: '10033371'
  soc: General disorders and administration site conditions
  definition_en: A disorder characterized by the sensation of marked discomfort, distress or agony.
  grades:
    '1': Mild pain
    '2': Moderate pain; limiting instrumental ADL or mild/moderate impact on age-appropriate normal daily activity (pediatric)
    '3': Severe pain; limiting self-care ADL or severe impact on age-appropriate normal daily activity (pediatric)
  locator: PDF S. 89 (Pain)
- id: CTCAE-PERIPHERAL_SENSORY_NEUROPATHY
  term_en: Peripheral sensory neuropathy
  label:
    cs: Periferní senzorická neuropatie
    en: Peripheral sensory neuropathy
    de: "Periphere sensorische Neuropathie"
  meddra_code: '10034620'
  soc: Nervous system disorders
  definition_en: A disorder characterized by damage or dysfunction of the peripheral sensory nerves.
  grades:
    '1': Mild symptoms
    '2': Moderate symptoms; limiting instrumental ADL or mild/moderate impact on age-appropriate normal daily activity (pediatric)
    '3': Severe symptoms; limiting self-care ADL or severe impact on age-appropriate normal daily activity (pediatric)
    '4': Life-threatening consequences; urgent intervention indicated
  locator: PDF S. 223 (Peripheral sensory neuropathy)
- id: CTCAE-PERIPHERAL_MOTOR_NEUROPATHY
  term_en: Peripheral motor neuropathy
  label:
    cs: Periferní motorická neuropatie
    en: Peripheral motor neuropathy
    de: "Periphere motorische Neuropathie"
  meddra_code: '10034580'
  soc: Nervous system disorders
  definition_en: A disorder characterized by damage or dysfunction of the peripheral motor nerves.
  grades:
    '1': Mild symptoms; clinical or diagnostic observations only
    '2': Moderate symptoms; limiting instrumental ADL or mild/moderate impact on age-appropriate normal daily activity (pediatric)
    '3': Severe symptoms; limiting self-care ADL or severe impact on age-appropriate normal daily activity (pediatric)
    '4': Life-threatening consequences; urgent intervention indicated
    '5': Death
  locator: PDF S. 223 (Peripheral motor neuropathy)
- id: CTCAE-PALMAR_PLANTAR_ERYTHRODYSESTHESIA_SYNDROME
  term_en: Palmar-plantar erythrodysesthesia syndrome
  label:
    cs: Syndrom palmárně-plantární erytrodysestezie (syndrom ruka-noha)
    en: Palmar-plantar erythrodysesthesia syndrome
    de: "Palmar-plantares Erythrodysästhesie-Syndrom"
  meddra_code: '10054524'
  soc: Skin and subcutaneous tissue disorders
  definition_en: A disorder characterized by redness, marked discomfort, swelling, and tingling in the palms of the hands or the soles of the feet. Also known as Hand-Foot Syndrome.
  grades:
    '1': Minimal skin changes or dermatitis (e.g., erythema, edema, or hyperkeratosis) without pain
    '2': Skin changes (e.g., peeling, blisters, bleeding, fissures, edema, or hyperkeratosis) with pain; limiting instrumental ADL or mild/moderate impact on age-appropriate normal daily activity (pediatric)
    '3': Severe skin changes (e.g., peeling, blisters, bleeding, fissures, edema, or hyperkeratosis) with pain; limiting self-care ADL or severe impact on age-appropriate normal daily activity (pediatric)
  locator: PDF S. 297 (Palmar-plantar erythrodysesthesia syndrome)
- id: CTCAE-MUCOSITIS_ORAL
  term_en: Mucositis oral
  label:
    cs: Orální mukositida (zánět sliznice dutiny ústní)
    en: Mucositis oral
    de: "Orale Mukositis"
  meddra_code: '10028130'
  soc: Gastrointestinal disorders
  definition_en: A disorder characterized by ulceration or inflammation of the oral mucosal.
  grades:
    '1': Asymptomatic or mild symptoms; intervention not indicated
    '2': Moderate pain or ulcer that does not interfere with oral intake; modified diet indicated
    '3': Severe pain; interfering with oral intake
    '4': Life-threatening consequences; urgent intervention indicated
    '5': Death
  locator: PDF S. 69 (Mucositis oral)
- id: CTCAE-RASH_MACULO_PAPULAR
  term_en: Rash maculo-papular
  label:
    cs: Makulopapulózní vyrážka
    en: Rash maculo-papular
    de: "Makulopapulöser Hautausschlag"
  meddra_code: '10037868'
  soc: Skin and subcutaneous tissue disorders
  definition_en: A disorder characterized by the presence of macules (flat) and papules (elevated). Also known as morbilliform rash, it is one of the most common cutaneous adverse events, frequently affecting the upper trunk, spreading centripetally and associated with pruritis.
  grades:
    '1': Asymptomatic
    '2': Mild symptoms
    '3': Macules/papules covering >50% BSA; moderate or severe symptoms
    '4': Life-threatening consequences; urgent intervention indicated
    '5': Death
  locator: PDF S. 299 (Rash maculo-papular)
- id: CTCAE-DYSPNEA
  term_en: Dyspnea
  label:
    cs: Dušnost
    en: Dyspnea
    de: "Dyspnoe"
  meddra_code: '10013963'
  soc: Respiratory, thoracic and mediastinal disorders
  definition_en: A disorder characterized by an uncomfortable sensation of difficulty breathing.
  grades:
    '1': Shortness of breath with moderate exertion
    '2': Shortness of breath with minimal exertion; limiting instrumental ADL or mild/moderate impact on age-appropriate normal daily activity (pediatric)
    '3': Shortness of breath at rest; limiting self-care ADL or severe impact on age-appropriate normal daily activity (pediatric)
    '4': Life-threatening consequences; urgent intervention indicated
    '5': Death
  locator: PDF S. 272 (Dyspnea)
- id: CTCAE-ANOREXIA
  term_en: Anorexia
  label:
    cs: Anorexie (ztráta chuti k jídlu)
    en: Anorexia
    de: "Anorexie"
  meddra_code: '10002646'
  soc: Metabolism and nutrition disorders
  definition_en: A disorder characterized by a loss of appetite.
  grades:
    '1': Loss of appetite without alteration in eating habits
    '2': Oral intake altered without significant weight loss or malnutrition; oral nutritional supplements indicated
    '3': Associated with significant weight loss or malnutrition (e.g., inadequate oral caloric and/or fluid intake); tube feeding or TPN indicated
    '4': Life-threatening consequences; urgent intervention indicated
    '5': Death
  locator: PDF S. 175 (Anorexia)
