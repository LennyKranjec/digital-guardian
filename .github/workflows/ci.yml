name: ci

on:
  push:
    branches: [main, 'feat/**', 'verify/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12' # ADR-0002: CI auf 3.12, lokal 3.14
          cache: pip
          cache-dependency-path: platform/backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      # challenge/backend gehört in jede Schranke, sobald es existiert
      - run: ruff check . ../../tests ../../scripts $(test -d ../../challenge/backend && echo ../../challenge/backend)
      - run: ruff format --check . ../../tests ../../scripts $(test -d ../../challenge/backend && echo ../../challenge/backend)
      - run: mypy app ../../tests/backend $(test -d ../../challenge/backend && echo ../../challenge/backend)
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npx prettier --check .
      - run: npx tsc -p platform/frontend --noEmit
      - run: npx tsc -p platform/packages/design-tokens --noEmit
      - run: npx tsc -p tests/e2e --noEmit
      - run: npm test
      - run: npm run build
